[package]
name = "avarice-rt-stdlib"
version = "0.1.0"
# Astra's own edition and rust-version: its sources use let-chains, which need 2024.
edition = "2024"
rust-version = "1.94"
description = "The avarice-rt stdlib modules, derived from Astra"
repository = "https://github.com/lloydeverett/avarice-rt"
license = "Apache-2.0"
publish = false

[features]
# Every stdlib module is behind a feature that compiles it in (ADR 0007). A feature decides only
# whether the code is part of the build; which modules a runtime registers is the core's business.
# The stdlib crate is only ever used through avarice-rt, which turns off the defaults and forwards
# these under the same names, but a plain `cargo test -p avarice-rt-stdlib` tests everything.
default = ["stdlib"]
stdlib = [
  "stdlib-http",
  "stdlib-fs",
  "stdlib-crypto",
  "stdlib-serde",
  "stdlib-datetime",
  "stdlib-utils",
  "stdlib-stores",
  "stdlib-validation",
]
stdlib-http = ["dep:reqwest", "dep:futures", "dep:tracing", "_astra_serde", "_astra_buffers"]
stdlib-fs = ["dep:glob", "tokio/fs", "tokio/io-util", "_astra_buffers"]
stdlib-crypto = ["dep:sha2", "dep:sha3", "dep:base64"]
stdlib-serde = ["_astra_serde"]
stdlib-datetime = ["dep:chrono"]
stdlib-utils = ["_astra_utils"]
# Astra's `stores` has no Rust half, so there is nothing for it to pull in.
stdlib-stores = []
stdlib-validation = ["_astra_utils"]

# Not part of the API. Astra's files cannot be split (ADR 0006), so a module that needs a piece of
# another's Rust takes the whole file, and these compile the file without adding the module: `http`
# calls `sanetize_lua_input` from `astra_serde.rs` and `validation` builds `AstraRegex` from
# `utils.rs`, and neither registers `serde` or `utils`. `_astra_buffers` is the buffer types and
# JSON helpers that `components/mod.rs` holds for `http` and `fs`.
_astra_serde = [
  "dep:serde-value",
  "dep:serde_json",
  "dep:serde_json5",
  "dep:serde_yaml",
  "dep:serde_ini",
  "dep:csv",
  "dep:quick-xml",
  "dep:toml",
  "dep:pastey",
]
_astra_utils = ["dep:uuid", "dep:regex"]
_astra_buffers = ["dep:bytes", "dep:serde_json"]

# Everything below `mlua` and `bitflags` is a dependency Astra already has, at the version
# requirement Astra's Cargo.toml gives it, because the sources here are Astra's. All of it is
# optional, behind the feature that needs it: see `[features]`.

[dependencies]
# Depends on mlua and never on avarice-rt: the dependency runs one way only.
# `async`, `macros`, `send` and `serialize` are what Astra's sources are written against: `send`
# because `utils.rs` puts tasks on `tokio::spawn`, which needs a Send Lua. They are on in every
# build, so the core's API does not vary with features (ADR 0007).
mlua = { workspace = true, features = ["async", "macros", "send", "serialize"] }
# For `StdModules`. Not an Astra dependency, and not mlua's either; it is already in the tree
# through reqwest's tower-http and reedline's crossterm.
bitflags = "2"

# http
reqwest = { version = "0.13.4", features = [
  "charset",
  "form",
  "http2",
  "json",
  "multipart",
  "rustls",
  "stream",
], default-features = false, optional = true }
glob = { version = "0.3.3", optional = true }

# data formats
serde-value = { version = "0.7.0", optional = true }
serde_json = { version = "1.0.150", optional = true }
serde_json5 = { version = "0.2.1", optional = true }
serde_yaml = { version = "0.9.34", optional = true }
serde_ini = { version = "0.2.0", optional = true }
csv = { version = "1.4.0", optional = true }
quick-xml = { version = "0.41.0", features = [
  "async-tokio",
  "encoding",
  "escape-html",
  "overlapped-lists",
  "serialize",
], optional = true }
toml = { version = "1.1.2", optional = true }
uuid = { version = "1.23.4", features = ["serde", "v4"], optional = true }
sha2 = { version = "0.11.0", optional = true }
sha3 = { version = "0.12.0", optional = true }
base64 = { version = "0.22.1", optional = true }
bytes = { version = "1.12.0", features = ["serde"], optional = true }
chrono = { version = "0.4.45", features = ["serde"], optional = true }

# runtime
# Astra takes `macros`, `rt-multi-thread` and `signal`; the sources here use `spawn`, `time`,
# `fs` and `sync::Mutex`, so those are the features taken. `stdlib-fs` adds `fs`, and `io-util` for
# the `AsyncReadExt` and `AsyncWriteExt` it reads and writes files with.
tokio = { version = "1.52.3", features = ["rt", "sync", "time"] }
futures = { version = "0.3.32", optional = true }
tracing = { version = "0.1.44", optional = true }
regex = { version = "1.12.4", optional = true }
pastey = { version = "0.2.3", optional = true }
