[workspace]
members = [".", "crates/avarice-rt-stdlib"]
resolver = "2"

[workspace.dependencies]
mlua = { version = "0.12.1", features = ["lua54", "vendored"] }

[package]
name = "avarice-rt"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "An embeddable Lua 5.4 runtime with a sandbox, and the avrt interpreter"
repository = "https://github.com/lloydeverett/avarice-rt"
publish = false

[lib]
name = "avarice_rt"
path = "src/lib.rs"

[[bin]]
name = "avrt"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The `avrt` command-line program. Embedders should depend on avarice-rt with
# `default-features = false` to avoid pulling in clap and reedline. `tokio/signal` is what
# catches Ctrl-C.
cli = ["dep:clap", "dep:reedline", "tokio/signal"]

[dependencies]
# `async` for `exec_async` and friends; the stdlib crate adds `send` on top, by unification.
mlua = { workspace = true, features = ["async"] }
# The core owns the executor (ADR 0004). `net` and `time` are the drivers the stdlib's http and
# task timers need, so the runtime is built with them rather than relying on another crate's
# features arriving by unification. `sync` is for waking a waiting chunk when it is cancelled.
tokio = { version = "1.52.3", features = ["net", "rt", "sync", "time"] }
avarice-rt-stdlib = { path = "crates/avarice-rt-stdlib" }
thiserror = "2.0"
clap = { version = "4.6", features = ["derive"], optional = true }
reedline = { version = "0.51", optional = true }
