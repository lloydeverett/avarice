[workspace]
members = [".", "crates/avarice-rt-stdlib"]
resolver = "2"

[workspace.dependencies]
mlua = { version = "0.12.1", features = ["lua54", "vendored"] }

[package]
name = "avarice-rt"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "An embeddable Lua 5.4 runtime with a sandbox, and the avrt interpreter"
repository = "https://github.com/lloydeverett/avarice-rt"
publish = false

[lib]
name = "avarice_rt"
path = "src/lib.rs"

[[bin]]
name = "avrt"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli", "stdlib"]
# The `avrt` command-line program. Embedders should depend on avarice-rt with
# `default-features = false` to avoid pulling in clap and reedline. `tokio/signal` is what
# catches Ctrl-C. `anstyle-parse` and `anstyle-query` are what `avrt` filters escape sequences out
# of its output with, and decide from the environment whether colour is let through (ADR 0010).
cli = [
  "dep:anstyle-parse",
  "dep:anstyle-query",
  "dep:clap",
  "dep:reedline",
  "tokio/signal",
]

# The stdlib modules, one feature each, forwarded to the stdlib crate under the same name (ADR
# 0007). A feature decides whether a module is compiled in; which a runtime registers is the
# profile's business. An embedder that wants a few of them depends on avarice-rt with
# `default-features = false` and names those.
stdlib = [
  "stdlib-http",
  "stdlib-fs",
  "stdlib-crypto",
  "stdlib-serde",
  "stdlib-datetime",
  "stdlib-utils",
  "stdlib-stores",
  "stdlib-validation",
]
# `net` is the tokio driver reqwest needs, so it follows `http`.
stdlib-http = ["avarice-rt-stdlib/stdlib-http", "tokio/net"]
stdlib-fs = ["avarice-rt-stdlib/stdlib-fs"]
stdlib-crypto = ["avarice-rt-stdlib/stdlib-crypto"]
stdlib-serde = ["avarice-rt-stdlib/stdlib-serde"]
stdlib-datetime = ["avarice-rt-stdlib/stdlib-datetime"]
stdlib-utils = ["avarice-rt-stdlib/stdlib-utils"]
stdlib-stores = ["avarice-rt-stdlib/stdlib-stores"]
stdlib-validation = ["avarice-rt-stdlib/stdlib-validation"]

[dependencies]
# `async` for `exec_async` and friends; the stdlib crate adds `send` on top, by unification.
mlua = { workspace = true, features = ["async"] }
# The core owns the executor (ADR 0004). `time` is the driver the stdlib's task timers need, so the
# runtime is built with it rather than relying on another crate's features arriving by
# unification; `net` is the one http needs, and `stdlib-http` adds it. `sync` is for waking a
# waiting chunk when it is cancelled.
tokio = { version = "1.52.3", features = ["rt", "sync", "time"] }
# Its defaults are off so that the features above are the whole selection. mlua's `send` still
# arrives through it, in every build, which the core's `Send + Sync` loader bound relies on.
avarice-rt-stdlib = { path = "crates/avarice-rt-stdlib", default-features = false }
thiserror = "2.0"
anstyle-parse = { version = "1", optional = true }
anstyle-query = { version = "1", optional = true }
clap = { version = "4.6", features = ["derive"], optional = true }
reedline = { version = "0.51", optional = true }
