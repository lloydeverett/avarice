[package]
name = "avarice"
version = "0.1.0"
# 2024, because the stdlib's sources (Astra's) use let-chains.
edition = "2024"
rust-version = "1.94"
description = "An embeddable Lua 5.4 runtime with a sandbox, and the avarice interpreter"
repository = "https://github.com/lloydeverett/avarice"
license = "Apache-2.0"
publish = false

# The example crates, which use avarice as other crates would (examples/README.md). `cargo test` at
# the root still tests only avarice; `cargo test --workspace` tests them too.
[workspace]
members = ["examples/greeting", "examples/app"]

[lib]
name = "avarice"
path = "src/lib.rs"

[[bin]]
name = "avarice"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli", "stdlib"]
# The `avarice` command-line program. Embedders should depend on avarice with
# `default-features = false` to avoid pulling in clap and reedline. `tokio/signal` is what
# catches Ctrl-C. `anstyle-parse` and `anstyle-query` are what `avarice` filters escape sequences
# out of its output with, and decide from the environment whether colour is let through (ADR 0010).
cli = [
  "dep:anstyle-parse",
  "dep:anstyle-query",
  "dep:clap",
  "dep:nu-ansi-term",
  "dep:reedline",
  "tokio/signal",
]

# The stdlib modules, one feature each (ADR 0007). A feature decides whether a module is compiled
# in; which a runtime registers is the profile's business. An embedder that wants a few of them
# depends on avarice with `default-features = false` and names those.
stdlib = [
  "stdlib-http",
  "stdlib-fs",
  "stdlib-crypto",
  "stdlib-serde",
  "stdlib-datetime",
  "stdlib-utils",
  "stdlib-stores",
  "stdlib-validation",
  "stdlib-dirs",
  "stdlib-process",
  "stdlib-tidings",
]
# `net` is the tokio driver reqwest needs, so it follows `http`.
stdlib-http = [
  "dep:reqwest",
  "dep:futures",
  "dep:tracing",
  "tokio/net",
  "_astra_serde",
  "_astra_buffers",
]
stdlib-fs = ["dep:glob", "tokio/fs", "tokio/io-util", "_astra_buffers"]
stdlib-crypto = ["dep:sha2", "dep:sha3", "dep:base64"]
stdlib-serde = ["_astra_serde"]
# `datetime` is original to avarice, built on jiff (ADR 0019).
stdlib-datetime = ["_datetime_types"]
stdlib-utils = ["_astra_utils"]
# Astra's `stores` has no Rust half, so there is nothing for it to pull in.
stdlib-stores = []
stdlib-validation = ["_astra_utils"]
# `dirs` is original to avarice, not derived from Astra (ADR 0014).
stdlib-dirs = ["dep:etcetera"]
# `process` is original to avarice too (ADR 0016). `process` is tokio's child processes,
# `io-util` reads and writes their streams, `macros` reads them while waiting, `net` reads a merged
# stdout and stderr on Unix, and `fs` does on Windows, where a pipe cannot be read without blocking
# a thread. `which` finds a program, and `libc` sends `SIGTERM`, which neither std nor tokio can do
# yet.
stdlib-process = [
  "dep:which",
  "dep:libc",
  "tokio/process",
  "tokio/io-util",
  "tokio/macros",
  "tokio/net",
  "tokio/fs",
  "_astra_buffers",
]
# `tidings` is original to avarice too (ADR 0021): stores of files on tidings' filesystem, SQLite
# and memory backends. Its times are `datetime`'s Timestamps, so it compiles `datetime`'s types,
# and `macros` waits on a change feed, its closing and an abort at once.
stdlib-tidings = ["dep:tidings", "_datetime_types", "tokio/macros"]

# Not part of the API. Astra's files cannot be split (ADR 0006), so a module that needs a piece of
# another's Rust takes the whole file, and these compile the file without adding the module: `http`
# calls `sanetize_lua_input` from `astra_serde.rs` and `validation` builds `AstraRegex` from
# `utils.rs`, and neither registers `serde` or `utils`. `_astra_buffers` is the buffer types and
# JSON helpers that `src/stdlib/components/mod.rs` holds for `http`, `fs` and `process`.
# `_datetime_types` is `datetime`'s Rust types, which `tidings` gives its times as (ADR 0021).
_astra_serde = [
  "dep:serde-value",
  "dep:serde_json",
  "dep:serde_json5",
  "dep:serde_yaml",
  "dep:serde_ini",
  "dep:csv",
  "dep:quick-xml",
  "dep:toml",
  "dep:pastey",
]
_astra_utils = ["dep:uuid", "dep:regex"]
_astra_buffers = ["dep:bytes", "dep:serde_json"]
_datetime_types = ["dep:jiff"]

[dependencies]
# `async` for `exec_async` and friends. `macros`, `send` and `serialize` are what the stdlib's
# sources (Astra's) are written against: `send` because `utils.rs` puts tasks on `tokio::spawn`,
# which needs a Send Lua. All are on in every build, so the API does not vary with features (ADR
# 0007) and the core's `Send + Sync` loader bound holds.
mlua = { version = "0.12.1", features = [
  "lua54",
  "vendored",
  "async",
  "macros",
  "send",
  "serialize",
] }
# The core owns the executor (ADR 0004). `time` is the driver the stdlib's task timers need, so the
# runtime is built with it rather than relying on a feature arriving by unification; `sync` is for
# waking a waiting chunk when it is cancelled, and Astra's `sync::Mutex`. The drivers a module
# needs on top of these (`net`, `fs`, `io-util`) come with its feature.
tokio = { version = "1.52.3", features = ["rt", "sync", "time"] }
thiserror = "2.0"
# For `StdModules`. Not an Astra dependency, and not mlua's either; it is already in the tree
# through reqwest's tower-http and reedline's crossterm.
bitflags = "2"
anstyle-parse = { version = "1", optional = true }
anstyle-query = { version = "1", optional = true }
clap = { version = "4.6", features = ["derive"], optional = true }
reedline = { version = "0.51", optional = true }
# The prompt's highlighter names `Style` directly (ADR 0013); reedline re-exports this crate's
# `Color` but not `Style`. Pinned to the version reedline 0.51 already resolves to.
nu-ansi-term = { version = "0.50.3", optional = true }

# The stdlib's own dependencies (src/stdlib), all optional, behind the feature that needs them.
# They are Astra's, at the version requirement Astra's Cargo.toml gives, because the sources are
# Astra's.
# http
reqwest = { version = "0.13.4", features = [
  "charset",
  "form",
  "http2",
  "json",
  "multipart",
  "rustls",
  "stream",
], default-features = false, optional = true }
glob = { version = "0.3.3", optional = true }

# data formats
serde-value = { version = "0.7.0", optional = true }
serde_json = { version = "1.0.150", optional = true }
serde_json5 = { version = "0.2.1", optional = true }
serde_yaml = { version = "0.9.34", optional = true }
serde_ini = { version = "0.2.0", optional = true }
csv = { version = "1.4.0", optional = true }
quick-xml = { version = "0.41.0", features = [
  "async-tokio",
  "encoding",
  "escape-html",
  "overlapped-lists",
  "serialize",
], optional = true }
toml = { version = "1.1.2", optional = true }
uuid = { version = "1.23.4", features = ["serde", "v4"], optional = true }
sha2 = { version = "0.11.0", optional = true }
sha3 = { version = "0.12.0", optional = true }
base64 = { version = "0.22.1", optional = true }
bytes = { version = "1.12.0", features = ["serde"], optional = true }

# runtime
futures = { version = "0.3.32", optional = true }
tracing = { version = "0.1.44", optional = true }
regex = { version = "1.12.4", optional = true }
pastey = { version = "0.2.3", optional = true }

# `dirs`'s own dependency. Unlike its neighbours above, this one is not Astra's: `dirs` is original
# to avarice (ADR 0014), and `etcetera` is the crate that computes its paths.
etcetera = { version = "0.11", optional = true }

# `datetime`'s own dependency, not Astra's either (ADR 0019). jiff's default features read the
# system's zoneinfo where there is one and bundle the time zone database on Windows, where there is
# none (`tzdb-bundle-platform`).
jiff = { version = "0.2.37", optional = true }

# `process`'s own dependencies, not Astra's either (ADR 0016). `which` searches `PATH`, honouring
# `PATHEXT` on Windows; `libc` is Unix-only, for `kill`.
which = { version = "8", optional = true }

# `tidings`'s own dependency, not Astra's either (ADR 0021). Not on crates.io, so it comes from git,
# pinned to a commit. Its `blocking` and `testing` features are for other callers and its own tests.
[dependencies.tidings]
git = "https://github.com/lloydeverett/tidings"
rev = "1345e299482378a46ae0c54755da8cd1863bcda8"
default-features = false
features = ["fs", "sqlite"]
optional = true

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }
